name: 构建安装包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: macOS dmg（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon（M 系列）
          - os: macos-latest
            label: arm64
            asset: macOS-arm64
            artifact: macOS-arm64
          # Intel
          - os: macos-13
            label: Intel
            asset: macOS-Intel
            artifact: macOS-Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 .app
        run: >
          pyinstaller --windowed --clean --noconfirm
          --name "小鹤双拼练习"
          --icon app.icns
          --add-data "xiaohe_data.json:."
          --add-data "texts.json:."
          xiaohe_app.py

      - name: 自检（架构与 Info.plist）
        run: |
          test -f "dist/小鹤双拼练习.app/Contents/Info.plist" || { echo "缺少 Info.plist"; exit 1; }
          file "dist/小鹤双拼练习.app/Contents/MacOS/小鹤双拼练习"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "dist/小鹤双拼练习.app/Contents/Info.plist"

      - name: 制作 DMG
        run: |
          mkdir -p dist/dmg
          cp -R "dist/小鹤双拼练习.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "小鹤双拼练习" -srcfolder dist/dmg -ov -format UDZO "dist/XiaoheShuangpin-${{ github.ref_name }}-${{ matrix.asset }}.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: XiaoheShuangpin-${{ matrix.artifact }}
          path: dist/XiaoheShuangpin-${{ github.ref_name }}-${{ matrix.asset }}.dmg

      - name: 发布到 Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XiaoheShuangpin-${{ github.ref_name }}-${{ matrix.asset }}.dmg
